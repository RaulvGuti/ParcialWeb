<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis tareas</title>
<style>
:root{--bg:#f3f5f1;--ink:#1d2a24;--mute:#66736c;--line:#d5dcd5;--card:#fff;--ok:#2f7d5b;--pend:#b7791f;--acc:#1f4d3a}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#e6ece7;--mute:#93a099;--line:#2b3630;--card:#1b231f;--ok:#5bc296;--pend:#e0b04f;--acc:#8fd1b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding:32px 20px 60px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;font:inherit}
.bar button[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible{outline:3px solid var(--pend);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--pend);border-radius:8px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
li.completada{border-left-color:var(--ok)}
li.completada .t{text-decoration:line-through;color:var(--mute)}
.t{font-weight:700;background:none;border:0;padding:0;color:inherit;font:inherit;font-weight:700;cursor:pointer;text-align:left}
.m{color:var(--mute);font-size:.9rem}
.act{display:flex;gap:8px;align-items:center}
.done{border:1px solid var(--ok);background:transparent;color:var(--ok);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
.done:hover{background:var(--ok);color:var(--bg)}
.tag{font-size:.85rem;color:var(--ok)}
aside{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
aside h2{font-family:Georgia,serif;font-size:1.2rem;margin:0 0 8px}
pre{margin:0;overflow-x:auto;font-size:.85rem}
.err{color:#b3261e}
.empty{color:var(--mute);padding:24px;text-align:center}
</style>
</head>
<body>
<main>
  <h1>Mis tareas</h1>
  <p class="sub" id="resumen">Cargando…</p>
  <div class="bar" role="group" aria-label="Filtrar por estado">
    <button data-f="" aria-pressed="true">Todas</button>
    <button data-f="pendiente" aria-pressed="false">Pendientes</button>
    <button data-f="completada" aria-pressed="false">Completadas</button>
  </div>
  <ul id="lista"></ul>
  <aside id="detalle" hidden>
    <h2>Detalle de la tarea</h2>
    <pre id="json"></pre>
  </aside>
</main>

<script>
/* ---------- API real ---------- */
const api = (method, url) => fetch(url, { method });

/* ---------- Dashboard ---------- */
const $ = s => document.querySelector(s);
let filtro = "";

async function cargar() {
  const q = filtro ? `?estado=${filtro}` : "";
  const r = await api("GET", `/api/v1/tareas${q}`);
  const data = await r.json();
  const lista = $("#lista");
  lista.innerHTML = "";
  if (!r.ok) { lista.innerHTML = `<li class="err">${data.error.mensaje}</li>`; return; }
  const todas = await (await api("GET", "/api/v1/tareas")).json();
  const pend = todas.filter(t => t.estado === "pendiente").length;
  $("#resumen").textContent = `${pend} pendiente${pend === 1 ? "" : "s"} de ${todas.length} tareas.`;
  if (!data.length) { lista.innerHTML = '<li class="empty">No hay tareas con este estado.</li>'; return; }
  for (const t of data) {
    const li = document.createElement("li");
    li.className = t.estado;
    const fecha = new Date(t.fechaEntrega + "T00:00:00").toLocaleDateString("es-GT", {day:"numeric", month:"long", year:"numeric"});
    li.innerHTML = `<div><button class="t" data-ver="${t.id}"></button><div class="m"></div></div><div class="act"></div>`;
    li.querySelector(".t").textContent = t.titulo;
    li.querySelector(".m").textContent = `${t.curso} · Entrega: ${fecha}`;
    const act = li.querySelector(".act");
    if (t.estado === "pendiente") {
      const b = document.createElement("button");
      b.className = "done"; b.textContent = "Marcar como completada"; b.dataset.done = t.id;
      act.appendChild(b);
    } else act.innerHTML = '<span class="tag">Completada</span>';
    lista.appendChild(li);
  }
}

async function ver(id) {
  const r = await api("GET", `/api/v1/tareas/${id}`);
  $("#json").textContent = JSON.stringify(await r.json(), null, 2);
  $("#detalle").hidden = false;
}

document.addEventListener("click", async e => {
  const f = e.target.closest("[data-f]");
  if (f) {
    filtro = f.dataset.f;
    document.querySelectorAll("[data-f]").forEach(b => b.setAttribute("aria-pressed", b === f));
    return cargar();
  }
  const v = e.target.closest("[data-ver]");
  if (v) return ver(v.dataset.ver);
  const d = e.target.closest("[data-done]");
  if (d) { await api("PATCH", `/api/v1/tareas/${d.dataset.done}/completar`); cargar(); }
});

cargar();
</script>
</body>
</html>
